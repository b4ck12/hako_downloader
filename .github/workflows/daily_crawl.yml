name: Daily Novel Crawl

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Number of feed pages to scan from Latest Updates (Mới cập nhật)'
        required: false
        default: '5'
        type: string
      force:
        description: 'Force re-sync all checked novels regardless of chapter cache'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl Daily Updates (6h Interval)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite database cache
        uses: actions/cache@v4
        id: db-cache
        with:
          path: data/hako.db
          key: hako-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hako-db-${{ runner.os }}-

      - name: Ensure Database is Ready (Cache or Skeleton Seed)
        run: |
          mkdir -p data
          # If data/hako.db does not exist or is less than 1MB (e.g. cache miss), seed from committed skeleton
          if [ ! -f data/hako.db ] || [ $(stat -c%s data/hako.db 2>/dev/null || echo 0) -lt 1000000 ]; then
            echo "No cached DB found. Initializing data/hako.db from committed data/hako_skeleton.db..."
            cp data/hako_skeleton.db data/hako.db
            echo "Seeded database ready: $(stat -c%s data/hako.db) bytes."
          else
            echo "Restored database from cache: $(stat -c%s data/hako.db) bytes."
          fi

      - name: Setup Cloudflare WARP (Bypass Datacenter IP blocking)
        uses: fscarmen/warp-on-actions@v1.4
        continue-on-error: true

      - name: Setup Tor Service (Fallback Proxy)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tor
          sudo systemctl start tor
          sleep 2
          echo "Tor service status:"
          sudo systemctl status tor --no-pager || true

      - name: Verify Network & docln.sbs Connectivity
        run: |
          echo "Checking outbound public IP..."
          curl -s https://api.ipify.org || echo "Could not fetch public IP"
          echo ""
          echo "Testing HTTP connection to docln.sbs..."
          curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "https://docln.sbs/danh-sach?sapxep=capnhat" | head -n 12 || echo "Curl test completed"

      - name: Run Daily Incremental Crawl
        run: |
          PAGES="${{ github.event.inputs.pages || '5' }}"
          FORCE="${{ github.event.inputs.force == 'true' && '--force' || '' }}"
          echo "Starting daily crawl (pages: $PAGES, force: $FORCE)..."
          python main.py --config config/config_ci.yaml daily --pages "$PAGES" $FORCE

      - name: Show Database Statistics
        run: |
          python main.py --config config/config_ci.yaml stats

      - name: Package Crawled Data & Database
        run: |
          mkdir -p artifacts
          python -c "import sqlite3, os; [sqlite3.connect(f).execute('PRAGMA wal_checkpoint(TRUNCATE);') for f in ['data/hako.db'] if os.path.exists(f)]"
          zip -r "artifacts/hako_daily_${{ github.run_id }}.zip" data output logs -x "*.pyc" -x "*__pycache__*" -x "data/hako_skeleton.db"

      - name: Upload Daily Crawl Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hako-daily-data
          path: |
            data/hako.db
            output/
            logs/
            artifacts/*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Publish or Update Rolling Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          NOTES="### 🚀 Hako Automated Daily Crawl Data
          - **Timestamp**: $RUN_DATE
          - **Run ID**: ${{ github.run_id }}
          
          #### 📥 How to merge into your local database:
          1. Download the zip file attached below (or from the Actions artifact).
          2. Run the merge command on your local machine:
          \`\`\`bash
          python main.py merge --source /path/to/hako_daily_${{ github.run_id }}.zip
          \`\`\`"

          gh release create daily-latest artifacts/*.zip \
            --title "Latest Daily Crawl Data ($RUN_DATE)" \
            --notes "$NOTES" \
            --clobber || echo "Notice: Release upload skipped or permissions limited."
