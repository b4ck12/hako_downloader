# Configuration for GitHub Actions Automated Crawler
app:
  name: "Hako Crawler System (CI)"
  version: "2.0.0"
  data_dir: "data"
  output_dir: "output"
  log_dir: "logs"

database:
  db_path: "data/hako.db"
  wal_mode: true
  busy_timeout_ms: 30000

crawler:
  base_url: "https://docln.sbs"
  user_data_dir: "./hako_session"
  headless: true
  num_workers: 2
  
  # Adaptive Rate Limiting
  max_rps: 0.85
  min_rps: 0.35
  chapter_delay_min: 0.08
  chapter_delay_max: 0.2
  page_delay_min: 0.4
  page_delay_max: 0.9
  random_jitter: true
  
  # 429 & Backoff handling
  backoff_429_min: 15.0
  backoff_429_max: 30.0
  max_retries: 3
  retry_backoff_base: 2.0
  enable_post_retry: true
  post_retry_max_attempts: 3
  post_retry_delay_sec: 5.0
  block_resources: true

media:
  download_images: true
  download_covers: true
  download_chapter_illustrations: true
  cover_dir: "output/media/covers"
  chapter_img_dir: "output/media/chapters"
  max_image_workers: 4
  image_timeout_sec: 25.0

proxy:
  enabled: true
  proxy_type: "socks5"
  proxy_url: "socks5://127.0.0.1:9050"
  rotate_interval_requests: 25

daily:
  check_interval_hours: 6
  latest_updates_max_pages: 3
  auto_retry_failed: true
  export_txt_on_complete: false
  feed_url_template: "https://docln.sbs/danh-sach?truyendich=1&sangtac=1&convert=1&dangtienhanh=1&tamngung=1&hoanthanh=1&sapxep=capnhat&page={page}"

export:
  output_dir: "output/novels"

logging:
  level: "INFO"
  rich_console: true
  log_file: "logs/crawler.log"
  max_bytes: 10485760
  backup_count: 5
